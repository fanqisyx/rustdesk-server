services:
  management:
    build: .
    restart: unless-stopped
    environment:
      RDM_ALLOW_REGISTRATION: ${RDM_ALLOW_REGISTRATION:-1}
    volumes:
      - management-data:/data
    ports:
      - "127.0.0.1:21114:21114"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      RDM_DOMAIN: ${RDM_DOMAIN:?Set RDM_DOMAIN to the management server domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      management:
        condition: service_healthy
volumes:
  management-data:
  caddy-data:
  caddy-config:
