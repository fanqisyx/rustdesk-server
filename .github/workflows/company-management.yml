name: Company management Windows

on:
  workflow_dispatch:
  push:
    branches: ['release/company-*']
    tags: ['v*-company.*']
  pull_request:
    paths: ['management/**', 'tools/**', 'docs/company/**', 'README.md', 'COMPANY_RELEASE', '.github/workflows/company-management.yml']

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r management/requirements-dev.txt
      - run: python -m unittest discover -s management -p 'test_*.py' -v
      - run: docker build management

  windows-package:
    needs: api-tests
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: version
        shell: pwsh
        run: |
          $tag = (Get-Content COMPANY_RELEASE -Raw).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+-company\.\d+$') { throw 'Invalid company version' }
          if ($env:GITHUB_REF.StartsWith('refs/heads/release/company-') -and $env:GITHUB_REF -ne "refs/heads/release/company-$tag") { throw 'Release branch mismatch' }
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF -ne "refs/tags/$tag") { throw 'Release tag mismatch' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: pip install -r management/requirements-build.txt
      - run: python -m unittest discover -s management -p 'test_*.py' -v
      - name: Build standalone management EXE
        shell: pwsh
        run: ./tools/build_management_windows.ps1
      - name: Exercise real EXE with a disposable database
        run: python tools/smoke_management_binary.py
      - name: Package company management add-on
        run: python tools/package_company_windows.py
      - name: Build graphical Windows installer
        run: python tools/build_windows_setup.py
      - name: Build and exercise certificate-free HTTP installer
        shell: pwsh
        run: |
          python tools/build_windows_setup.py --http
          $tag = (Get-Content COMPANY_RELEASE -Raw).Trim()
          ./tools/smoke_windows_http_setup.ps1 -SetupFile "dist/company-release/rustdesk-server-company-$tag-HTTP-Setup.exe"
      - name: Verify installer conflict guard
        shell: pwsh
        run: |
          $tag = (Get-Content COMPANY_RELEASE -Raw).Trim()
          ./tools/smoke_windows_setup.ps1 -SetupFile "dist/company-release/rustdesk-server-company-$tag-Setup.exe"
      - name: Validate configuration and service templates
        shell: pwsh
        run: |
          $tag = (Get-Content COMPANY_RELEASE -Raw).Trim()
          Expand-Archive "dist/company-release/rustdesk-server-company-windows-x86_64-$tag.zip" dist/verify
          $bundle = (Get-ChildItem dist/verify -Directory | Select-Object -First 1).FullName
          Push-Location $bundle
          try {
            ./windows/caddy.exe validate --config windows/Caddyfile.ip --adapter caddyfile
            if ($LASTEXITCODE -ne 0) { throw 'Caddy validation failed' }
            foreach ($script in Get-ChildItem windows -Filter *.ps1) {
              $tokens = $null; $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count) { throw ($errors | Out-String) }
            }
            $occupied = @(Get-NetTCPConnection -State Listen | Where-Object { $_.LocalPort -in @(80,443,21114) })
            if ($occupied.Count) {
              try {
                ./windows/Install-Management.ps1 -PublicIp '203.0.113.10' -WhatIf
                throw 'Expected the installer to reject occupied ports'
              } catch {
                if ($_.Exception.Message -notlike 'A required port is already in use*') { throw }
                Write-Output 'Installer correctly refused an existing listener without stopping it.'
              }
            } else {
              ./windows/Install-Management.ps1 -PublicIp '203.0.113.10' -WhatIf
            }
          } finally { Pop-Location }
          ./tools/smoke_windows_service.ps1 -BundleRoot $bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: company-windows-release
          path: |
            dist/company-release/*.zip
            dist/company-release/*.json
            dist/company-release/*.md
            dist/company-release/*.exe
            dist/company-release/*.pdf
            dist/company-release/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: windows-package
    if: startsWith(github.ref, 'refs/heads/release/company-') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: company-windows-release
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.windows-package.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            test "$existing_commit" = "$GITHUB_SHA"
            gh release edit "$RELEASE_TAG" --title "RustDesk company server $RELEASE_TAG" --notes-file "release/release-notes-$RELEASE_TAG.md" --prerelease
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "RustDesk company server $RELEASE_TAG" --notes-file "release/release-notes-$RELEASE_TAG.md" --prerelease
          fi
